---
name: benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: install pkg
        run: |
          sudo apt-get update
          sudo apt-get install -y curl sysbench
          curl --proto '=https' --tlsv1.2 -fsSL https://packagecloud.io/install/repositories/ookla/speedtest-cli/script.deb.sh | sudo bash
          sudo apt-get install -y speedtest

      - name: cpu test
        run: |
          sysbench cpu --threads=4 run

      - name: disk test
        run: |
          sysbench fileio --file-total-size=500M prepare
          sysbench fileio --file-total-size=500M --file-test-mode=rndrw --time=30 --threads=4 run

      - name: network test
        run: |
          speedtest --accept-license --accept-gdpr
